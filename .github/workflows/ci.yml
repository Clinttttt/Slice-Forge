name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the repository .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SliceForge.slnx

      - name: Verify formatting
        run: dotnet format SliceForge.slnx --verify-no-changes

      - name: Build Release
        run: dotnet build SliceForge.slnx -c Release --no-restore

      - name: Run all tests
        run: dotnet test SliceForge.slnx -c Release --no-build

      - name: Pack preview libraries
        run: dotnet pack SliceForge.slnx -c Release --no-restore -o artifacts/packages

      - name: Inspect packages and run isolated consumer
        shell: pwsh
        run: ./scripts/validate-packages.ps1
